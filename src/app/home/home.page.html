<ion-header class="ion-padding ion-no-border">
  <ion-button 
  expand="block"
  (click) = 'counterUp()'
  [disabled]="numero==MAXIMO"
  >
  <ion-icon name="caret-up-outline"></ion-icon>
</ion-button>
</ion-header>

<ion-content [fullscreen]="true">
  <!--Interpolación (one-way binding) -->
  <div class="center-content big-font">
    {{numero}}
  </div>
</ion-content>

<ion-footer class="ion-padding ion-no-border">
  <ion-button expand="block" 
  (click) = 'counterDown()'
  [disabled]="numero==MINIMO"
  >
  <ion-icon name="caret-down-outline"></ion-icon>
  </ion-button>
</ion-footer>
